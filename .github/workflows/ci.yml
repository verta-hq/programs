name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SOLANA_VERSION: 3.1.10
  ANCHOR_VERSION: 0.32.2
  NODE_VERSION: 22

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Cache Solana + Anchor toolchains
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cargo/bin/anchor
          key: toolchain-${{ runner.os }}-solana-${{ env.SOLANA_VERSION }}-anchor-cli-${{ env.ANCHOR_VERSION }}

      - name: Install Solana CLI
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"

      - name: Install Anchor CLI
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: cargo install anchor-cli --version ${ANCHOR_VERSION} --locked --force

      - name: Add toolchains to PATH
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Test keypair for the local validator
        run: solana-keygen new --no-bip39-passphrase --silent --force -o ~/.config/solana/id.json

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build program
        run: anchor build

      - name: Generate clients and check drift
        run: |
          node scripts/generate-clients.js --check
          git diff --exit-code -- idl/

      - name: Test program
        run: anchor test --skip-build
